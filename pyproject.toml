[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nat"]

[project]
name = "nemo-agent-toolkit-praisonai"
version = "0.0.1.dev0"
requires-python = ">=3.11,<3.14"
description = "PraisonAI integration for NVIDIA NeMo Agent Toolkit (research spike)"
license = { text = "MIT" }
dependencies = [
  "nvidia-nat-core>=1.8,<2",
  "praisonaiagents[llm]>=1.7.12",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "nvidia-nat-test>=1.8,<2"]

[project.entry-points."nat.plugins"]
nat_praisonai = "nat.plugins.praisonai.register"
